<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>React</title>
</head>
<body>
    <!-- //This <div> is the container where React will control everything. -->
    <!-- HTML gives React a place to work -->

    <div id="root"></div>  

    <!-- CDN LINKS -->
     <!-- React for creating elements and ReactDOM for putting them on the screen. -->
     <script crossorigin 
     src="https://unpkg.com/react@18/umd/react.development.js">
    </script>
    <script crossorigin 
    src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
    </script>
    <script src="./app.js"></script>
</body>
</html>
